name: Authentication security regression
on:
  pull_request:
    paths: ['backend/**', '.github/workflows/auth-security.yml']
  push:
    paths: ['backend/**', '.github/workflows/auth-security.yml']
permissions:
  contents: read
jobs:
  auth:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nextlink_security_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m compileall -q backend/api backend/core backend/services backend/tests
      - run: python -m pytest backend/tests -q
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nextlink_security_test
