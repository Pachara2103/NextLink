name: Frontend planner integration
on:
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend-integration.yml']
  push:
    paths: ['frontend/**', '.github/workflows/frontend-integration.yml']
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check:config
      - run: npm run check:planner
      - run: npm run lint
      - run: npm run build
        env:
          API_ORIGIN: ''
      - run: npx playwright install --with-deps chromium
      - run: npm run check:browser
